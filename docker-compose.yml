# One-command self-host: `docker compose up`, then run the migration once
# (see SELF_HOST.md) and you have the API + worker + Postgres + Redis +
# local object storage (MinIO, an S3-compatible store) running together.
#
# Swap the `minio` service for Cloudflare R2 (or any other S3-compatible
# store) in production by setting R2_* env vars instead of S3_* — see
# .env.example.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seenpaid
      POSTGRES_PASSWORD: seenpaid
      POSTGRES_DB: seenpaid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seenpaid']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket and makes it publicly readable so
  # uploaded images/video are servable at S3_PUBLIC_BASE_URL. Runs once on
  # `docker compose up` and exits — that's expected, it's not meant to stay up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/seenpaid-media &&
      mc anonymous set download local/seenpaid-media
      "

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://seenpaid:seenpaid@postgres:5432/seenpaid
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/seenpaid-media
      # The API container also runs the BullMQ worker in-process by default
      # (RUN_INLINE_WORKER unset). Set it to "false" here and uncomment the
      # separate `worker` service below if you want them scaled/deployed
      # independently.
    ports:
      - '3001:3001'

  # Optional standalone worker — only needed if you set
  # RUN_INLINE_WORKER=false on the api service above. Left commented out
  # because the in-process worker is the simpler default for a single
  # self-hosted instance.
  # worker:
  #   build: .
  #   restart: unless-stopped
  #   command: ['node', 'dist/jobs/worker.js']
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgres://seenpaid:seenpaid@postgres:5432/seenpaid
  #     REDIS_HOST: redis
  #     REDIS_PORT: '6379'

volumes:
  postgres-data:
  redis-data:
  minio-data:
